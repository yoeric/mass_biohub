title: "The BioHub"
description: "A planned shared bioindustrial manufacturing facility at Gateway Park in Worcester — pilot-scale fermentation, process development, and workforce training. Led by WPI and MBI, funded by MassTech."
url: "https://massbiohub.org"
baseurl: ""

markdown: kramdown
permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from   # old /services/, /partners/, /work-with-us/ URLs

# Don't render internal/dev files into the public site.
# Underscore folders (_to_delete/ etc.) are skipped by Jekyll already.
exclude:
  - CLAUDE.md
  - design.md
  - ledger.md
  - SITE_PLAN.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/

# Site-wide facts. Templates read these; do not retype them in pages.
# Partner names and URLs live in _data/partners.yml.
email: "biohub@wpi.edu"
address:
  street: "50 Prescott Street"
  place: "WPI Gateway Park"
  locality: "Worcester"
  region: "MA"
  postal_code: "01605"
